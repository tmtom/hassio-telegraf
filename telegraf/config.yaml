name: Telegraf
# Version scheme: <telegraf>.<build> — 1.40.3.1 = Telegraf 1.40.3 (the
# Dockerfile BUILD_FROM pin), app build 1. App-only releases bump the build
# counter; a Telegraf bump resets it to 1. Never use a prerelease counter
# (1.40.3-1) — HA's version comparator mishandles multi-digit ones.
version: "1.40.3.1"
slug: telegraf
description: Telegraf metrics agent — collect, process and forward metrics (e.g. MQTT to VictoriaMetrics/InfluxDB)
url: https://docs.influxdata.com/telegraf/
arch:
  - amd64
  - aarch64
startup: services
init: false
# Pre-built multi-arch image, built by GitHub Actions on every release.
image: ghcr.io/tmtom/hassio-telegraf
map:
  - type: app_config
    path: /config
    read_only: false   # NB: map entries default to read_only: TRUE
services:
  - mqtt:want
ports:
  8125/udp: null
  8092/udp: null
  8094/tcp: null
  9273/tcp: null
options:
  mqtt_automatic: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_automatic: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
