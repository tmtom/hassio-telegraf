name: Telegraf
version: "0.1.0-telegraf1.40"
slug: telegraf
description: Telegraf metrics agent — collect, process and forward metrics (e.g. MQTT to VictoriaMetrics/InfluxDB)
url: https://docs.influxdata.com/telegraf/
arch:
  - amd64
  - aarch64
startup: services
init: false
# Pre-built multi-arch image, built by GitHub Actions on every release.
# (Kept commented during development so the Supervisor builds locally;
#  enabled together with the CI pipeline in Phase 5.)
# image: ghcr.io/tmtom/hassio-telegraf
map:
  - type: app_config
    path: /config
services:
  - mqtt:want
ports:
  8125/udp: null
  8092/udp: null
  8094/tcp: null
  9273/tcp: null
options:
  mqtt_automatic: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_automatic: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
